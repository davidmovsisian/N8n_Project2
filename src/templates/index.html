<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>

<header>
  <h1>Document Analyzer</h1>
</header>

<main>
  <!-- Upload panel -->
  <section class="panel" aria-label="Upload">
    <h2>Upload Document</h2>

    <div id="drop-zone" role="button" tabindex="0" aria-label="Drag and drop a file or click to browse">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Drag &amp; drop a file here<br/>
      <small>or</small><br/>
      <label for="file-input" class="upload-btn" style="display:inline-block;margin-top:.5rem">Browse file</label>
    </div>

    <input type="file" id="file-input"
           accept=".pdf,.docx,.txt,.png,.jpg,.jpeg" />

    <p id="selected-file" aria-live="polite"></p>

    <button id="upload-btn" class="upload-btn" disabled>
      Upload &amp; Analyze
    </button>

    <div id="status" class="idle" aria-live="polite"></div>
  </section>

  <!-- Result panel -->
  <section class="panel" aria-label="Result">
    <h2>Analysis Result</h2>
    <button id="toggle-raw" hidden>Show raw JSON</button>
    <div id="preview-container">
      <iframe id="preview-iframe" title="Analysis preview" srcdoc=""></iframe>
      <pre id="preview-json"></pre>
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
