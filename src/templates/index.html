<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1.2rem 2rem;
    }
    header h1 { font-size: 1.5rem; font-weight: 600; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed #b0b8c9;
      border-radius: 8px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      color: #666;
      font-size: .95rem;
    }
    #drop-zone.drag-over {
      background: #eef2ff;
      border-color: #5c6bc0;
    }
    #drop-zone svg { display: block; margin: 0 auto .75rem; color: #8fa0b8; }

    #file-input { display: none; }

    .upload-btn {
      display: inline-block;
      margin-top: .25rem;
      padding: .5rem 1.2rem;
      background: #5c6bc0;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 500;
      transition: background .2s;
    }
    .upload-btn:hover { background: #3949ab; }
    .upload-btn:disabled { background: #aaa; cursor: default; }

    #selected-file {
      font-size: .85rem;
      color: #555;
      min-height: 1.2em;
      word-break: break-all;
    }

    /* Status bar */
    #status {
      font-size: .9rem;
      font-weight: 500;
      min-height: 1.4em;
      padding: .4rem .75rem;
      border-radius: 5px;
    }
    #status.idle  { color: #888; }
    #status.busy  { color: #1565c0; background: #e3f2fd; }
    #status.ok    { color: #2e7d32; background: #e8f5e9; }
    #status.error { color: #c62828; background: #ffebee; }

    /* Preview */
    #preview-container {
      flex: 1;
      overflow: auto;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      min-height: 300px;
      background: #fafafa;
    }

    #preview-iframe {
      width: 100%;
      height: 100%;
      min-height: 300px;
      border: none;
    }

    #preview-json {
      display: none;
      padding: 1rem;
      font-size: .82rem;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      color: #333;
    }

    #toggle-raw {
      font-size: .8rem;
      color: #5c6bc0;
      background: none;
      border: none;
      cursor: pointer;
      align-self: flex-end;
      padding: 0;
    }
    #toggle-raw:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>Document Analyzer</h1>
</header>

<main>
  <!-- Upload panel -->
  <section class="panel" aria-label="Upload">
    <h2>Upload Document</h2>

    <div id="drop-zone" role="button" tabindex="0" aria-label="Drag and drop a file or click to browse">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Drag &amp; drop a file here<br/>
      <small>or</small><br/>
      <label for="file-input" class="upload-btn" style="display:inline-block;margin-top:.5rem">Browse file</label>
    </div>

    <input type="file" id="file-input"
           accept=".pdf,.docx,.txt,.png,.jpg,.jpeg" />

    <p id="selected-file" aria-live="polite"></p>

    <button id="upload-btn" class="upload-btn" disabled>
      Upload &amp; Analyze
    </button>

    <div id="status" class="idle" aria-live="polite"></div>
  </section>

  <!-- Result panel -->
  <section class="panel" aria-label="Result">
    <h2>Analysis Result</h2>
    <button id="toggle-raw" hidden>Show raw JSON</button>
    <div id="preview-container">
      <iframe id="preview-iframe" title="Analysis preview" srcdoc=""></iframe>
      <pre id="preview-json"></pre>
    </div>
  </section>
</main>

<script>
  const dropZone     = document.getElementById('drop-zone');
  const fileInput    = document.getElementById('file-input');
  const uploadBtn    = document.getElementById('upload-btn');
  const selectedFile = document.getElementById('selected-file');
  const statusEl     = document.getElementById('status');
  const previewIframe = document.getElementById('preview-iframe');
  const previewJson  = document.getElementById('preview-json');
  const toggleRaw    = document.getElementById('toggle-raw');

  let currentFile = null;
  let rawJson = '';
  let showingRaw = false;

  // --- file selection ---
  function setFile(file) {
    currentFile = file;
    selectedFile.textContent = file ? `Selected: ${file.name}` : '';
    uploadBtn.disabled = !file;
  }

  fileInput.addEventListener('change', () => setFile(fileInput.files[0] || null));

  // --- drag and drop ---
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  });
  dropZone.addEventListener('click', e => {
    if (e.target.tagName !== 'LABEL') fileInput.click();
  });
  dropZone.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') fileInput.click();
  });

  // --- status helpers ---
  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  // --- preview helpers ---
  function showHtml(html) {
    previewIframe.style.display = 'block';
    previewJson.style.display   = 'none';
    previewIframe.srcdoc = html;
    showingRaw = false;
    toggleRaw.textContent = 'Show raw JSON';
  }
  function showJsonOnly(data) {
    previewIframe.style.display = 'none';
    previewJson.style.display   = 'block';
    previewJson.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    toggleRaw.hidden = true;
  }
  function setPreview(body) {
    const result = body.result;
    if (typeof result === 'string') {
      const looksLikeHtml = /<[a-z][\s\S]*>/i.test(result);
      rawJson = JSON.stringify(body, null, 2);
      if (looksLikeHtml) {
        showHtml(result);
        toggleRaw.hidden = false;
        toggleRaw.textContent = 'Show raw JSON';
      } else {
        showJsonOnly(result);
      }
    } else {
      showJsonOnly(result ?? body);
    }
  }

  toggleRaw.addEventListener('click', () => {
    if (!showingRaw) {
      previewIframe.style.display = 'none';
      previewJson.style.display   = 'block';
      previewJson.textContent = rawJson;
      toggleRaw.textContent = 'Show preview';
      showingRaw = true;
    } else {
      previewJson.style.display = 'none';
      previewIframe.style.display = 'block';
      toggleRaw.textContent = 'Show raw JSON';
      showingRaw = false;
    }
  });

  // --- upload ---
  uploadBtn.addEventListener('click', async () => {
    if (!currentFile) return;

    uploadBtn.disabled = true;
    setStatus('Uploading…', 'busy');

    const formData = new FormData();
    formData.append('file', currentFile);

    try {
      const res = await fetch('/upload-file', { method: 'POST', body: formData });
      const body = await res.json();

      if (!res.ok) {
        setStatus(`Error: ${body.error || res.statusText}`, 'error');
        return;
      }

      setStatus(`Done: ${body.filename}`, 'ok');
      setPreview(body);
    } catch (err) {
      setStatus(`Network error: ${err.message}`, 'error');
    } finally {
      uploadBtn.disabled = false;
    }
  });
</script>
</body>
</html>
