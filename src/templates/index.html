<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="app">
    <section class="panel upload-panel">
      <h1>Document Analyzer</h1>

      <form id="upload-form" class="upload-form">
        <div class="field">
          <label for="email-input">Email</label>
          <input
            id="email-input"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <label id="drop-zone" class="drop-zone">
          <input id="file-input" type="file" name="file" hidden />
          <span>Drag & drop a file here or click to upload</span>
        </label>

        <div class="actions">
          <button type="button" id="choose-file-btn">Choose file</button>
          <button type="submit">Analyze</button>
        </div>
      </form>

      <div id="status" class="status"></div>
    </section>

    <section class="panel result-panel">
      <div class="result-header">
        <h2>Analysis Result</h2>
        <button type="button" id="toggle-raw-btn">Show Raw</button>
      </div>

      <div id="html-result" class="html-result hidden">
        <iframe id="result-frame" title="Analysis result preview"></iframe>
      </div>

      <pre id="raw-result" class="raw-result hidden"></pre>

      <div id="empty-state" class="empty-state">
        Enter your email and upload a file to see analysis results.
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
