<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=5" />
</head>
<body>
  <main class="app">
    <section class="panel upload-panel">
      <h1>Document Analyzer</h1>

      <form id="upload-form" class="upload-form">
        <div class="field">
          <label for="email-input">Email</label>
          <input
            id="email-input"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div id="drop-zone" class="drop-zone">
          <input id="file-input" type="file" name="file" class="file-input-hidden" />
          <span>Drag & drop a file here or click to upload</span>
          <label for="file-input" id="choose-file-btn">Choose file</label>
        </div>

        <div id="selected-file" class="selected-file"></div>

        <div class="actions">
          <button type="button" id="upload-btn">Analyze</button>
        </div>
      </form>

      <div id="status" class="status"></div>

      <div class="uploaded-files-section">
        <h2>Uploaded Files</h2>
        <ul id="uploaded-files-list" class="uploaded-files-list">
          <li class="uploaded-files-empty">No files uploaded yet.</li>
        </ul>
      </div>
    </section>

    <section class="workspace">
      <section class="panel side-panel chatbot-panel" id="chatbot-panel">
        <button type="button" class="collapsed-bar" data-panel="chatbot" aria-label="Restore chatbot panel">
          Chatbot
        </button>

        <div class="panel-content">
          <div class="panel-header result-header">
            <h2>Chatbot</h2>
            <button type="button" class="toggle-panel-btn" id="hide-chatbot-btn" data-panel="chatbot" title="Hide chatbot panel" aria-label="Hide chatbot panel">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/>
              </svg>
            </button>
          </div>

          <div id="chat-history" class="chat-history">
            <div class="chat-empty-state">Upload and analyze a document to start chatting about it.</div>
          </div>

          <div class="chat-input-row">
            <input
              id="chat-input"
              class="chat-input"
              type="text"
              placeholder="Ask a question about the uploaded document"
              disabled
            />
            <button type="button" id="send-chat-btn" class="send-btn" title="Send message" aria-label="Send message" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13"/>
                <path d="M22 2 15 22 11 13 2 9 22 2z"/>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="panel side-panel result-panel" id="result-panel">
        <button type="button" class="collapsed-bar" data-panel="result" aria-label="Restore analysis result panel">
          Analysis Result
        </button>

        <div class="panel-content">
          <div class="panel-header result-header">
            <h2>Analysis Result</h2>
            <div class="result-actions">
              <button type="button" class="toggle-panel-btn" id="hide-result-btn" data-panel="result" title="Hide analysis result panel" aria-label="Hide analysis result panel">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14"/>
                </svg>
              </button>
              <button type="button" id="download-btn" class="download-btn hidden" title="Download result file">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div id="html-result" class="html-result hidden">
            <iframe id="preview-iframe" title="Analysis result preview"></iframe>
          </div>

          <pre id="preview-json" class="raw-result hidden"></pre>

          <div id="empty-state" class="empty-state">
            Enter your email and upload a file to see analysis results.
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}?v=5"></script>
</body>
</html>
